[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evocure"
version = "1.0.0"
description = "EVOCURE & EVOCURE PLAY - Evolutionary Chemical Universe & Cancer Research Engine (100% Local)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "EVOCURE Multi-Agent Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "websockets>=12.0,<17.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "rdkit>=2024.3.1",
    "psutil>=6.0.0,<8.0.0",
    "httpx>=0.27.0,<1.0.0",
    "fpdf2>=2.7.9,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
]
local-ai = [
    "laya>=0.3.7",
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "safetensors>=0.4.5",
]

[tool.setuptools.packages.find]
# The repository is a flat layout with several top level directories, most of
# which are data, assets or scripts rather than importable packages. Without
# this, setuptools auto-discovery refuses to build and `pip install .` fails.
include = ["ai*", "app*", "simulation*"]
exclude = ["tests*", "scripts*", "docs*", "reports*", "models*", "data*",
           "configs*", "frontend*", "godot_frontend*", "build*", "experiments*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
